spring:
  application:
    name: global-invoices-kata-mngr
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    mongodb:
      database: ${MONGODB_DATABASE:global_invoices}
    web:
      pageable:
        max-page-size: 100
        default-page-size: 20
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    operador:
      name: ${SEED_OPERADOR_NAME:Operador Demo}
      email: ${SEED_OPERADOR_EMAIL:operador@globalinvoice.com}
      password: ${SEED_OPERADOR_PASSWORD:}
    auditor:
      name: ${SEED_AUDITOR_NAME:Auditor Demo}
      email: ${SEED_AUDITOR_EMAIL:auditor@globalinvoice.com}
      password: ${SEED_AUDITOR_PASSWORD:}
