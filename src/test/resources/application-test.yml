    mongodb:
      embedded:
        version: 7.0.14

jwt:
  secret: Z2xvYmFsLWludm9pY2UtdGVzdC1zaWduaW5nLWtleS1kby1ub3QtdXNlLWluLXByb2QtMDEyMzQ1Njc4OQ==
  expiration-ms: 3600000

app:
